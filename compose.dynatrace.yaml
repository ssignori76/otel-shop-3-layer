services:
  otel-collector:
    image: ${IMAGE_REGISTRY:-commerce}/otel-collector:${APP_VERSION:-2.0.0}
    build:
      context: .
      dockerfile: docker/otel-collector/Dockerfile
    container_name: commerce-otel-collector-dt
    environment:
      DT_OTLP_ENDPOINT: ${DT_OTLP_ENDPOINT:?DT_OTLP_ENDPOINT must be set}
      DT_API_TOKEN: ${DT_API_TOKEN:?DT_API_TOKEN must be set}
    volumes:
      - ./observability/dynatrace/otel-collector-dynatrace.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - commerce-net

  auth-service:
    environment:
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=commerce-synthetic,deployment.environment.name=${DT_ENVIRONMENT:-production},service.version=${APP_VERSION:-2.0.0}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

  cart-service:
    environment:
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=commerce-synthetic,deployment.environment.name=${DT_ENVIRONMENT:-production},service.version=${APP_VERSION:-2.0.0}
