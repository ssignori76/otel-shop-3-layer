# Container health endpoint
<Location "/healthz">
    Require all granted
    Header always set Content-Type "application/json"
    ErrorDocument 200 "{\"status\":\"UP\",\"service\":\"apache-web\"}"
    Redirect 200 /healthz
</Location>

# Reverse proxy /api/* to Spring Cloud Gateway without retries and preserving W3C + correlation headers
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 25

ProxyPass "/api/" "http://api-gateway:8080/api/" retry=0 timeout=25 keepalive=On
ProxyPassReverse "/api/" "http://api-gateway:8080/api/"
