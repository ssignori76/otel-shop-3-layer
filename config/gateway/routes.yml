# Externalized Gateway Route Configuration Reference
spring:
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://auth-service:8086
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth(?<segment>/?.*), /internal/auth$\{segment}
        - id: products-service-route
          uri: http://cart-service:8081
          predicates:
            - Path=/api/products/**
          filters:
            - RewritePath=/api/products(?<segment>/?.*), /internal/products$\{segment}
        - id: cart-service-route
          uri: http://cart-service:8081
          predicates:
            - Path=/api/carts/**
          filters:
            - RewritePath=/api/carts(?<segment>/?.*), /internal/carts$\{segment}
        - id: checkout-service-route
          uri: http://checkout-service:8082
          predicates:
            - Path=/api/checkouts/**
          filters:
            - RewritePath=/api/checkouts(?<segment>/?.*), /internal/checkouts$\{segment}
        - id: orders-service-route
          uri: http://checkout-service:8082
          predicates:
            - Path=/api/orders/**
          filters:
            - RewritePath=/api/orders(?<segment>/?.*), /internal/orders$\{segment}
        - id: fulfillment-service-route
          uri: http://fulfillment-service:8084
          predicates:
            - Path=/api/fulfillments/**
          filters:
            - RewritePath=/api/fulfillments(?<segment>/?.*), /internal/fulfillments$\{segment}
