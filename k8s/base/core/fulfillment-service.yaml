apiVersion: v1
kind: Service
metadata:
  name: fulfillment-service
  namespace: commerce-core
  labels:
    app.kubernetes.io/name: fulfillment-service
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  selector:
    app.kubernetes.io/name: fulfillment-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillment-service
  namespace: commerce-core
  labels:
    app.kubernetes.io/name: fulfillment-service
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fulfillment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fulfillment-service
        app.kubernetes.io/part-of: commerce-synthetic
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fulfillment-service
          image: commerce/fulfillment-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: OTEL_SERVICE_NAME
              value: fulfillment-service
            - name: MYSQL_FULFILLMENT_USER
              valueFrom:
                secretKeyRef:
                  name: commerce-core-secrets
                  key: MYSQL_FULFILLMENT_USER
            - name: MYSQL_FULFILLMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-core-secrets
                  key: MYSQL_FULFILLMENT_PASSWORD
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: commerce-core-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-core-secrets
                  key: RABBITMQ_PASSWORD
          envFrom:
            - configMapRef:
                name: commerce-core-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            periodSeconds: 10
            timeoutSeconds: 3
