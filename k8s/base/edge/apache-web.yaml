apiVersion: v1
kind: ConfigMap
metadata:
  name: apache-httpd-conf
  namespace: commerce-edge
  labels:
    app.kubernetes.io/name: apache-web
    app.kubernetes.io/part-of: commerce-synthetic
data:
  httpd.conf: |
    ServerRoot "/usr/local/apache2"
    PidFile "/var/run/apache2/httpd.pid"
    Listen 8080

    LoadModule mpm_event_module modules/mod_mpm_event.so
    LoadModule authn_core_module modules/mod_authn_core.so
    LoadModule authz_core_module modules/mod_authz_core.so
    LoadModule authz_host_module modules/mod_authz_host.so
    LoadModule reqtimeout_module modules/mod_reqtimeout.so
    LoadModule filter_module modules/mod_filter.so
    LoadModule mime_module modules/mod_mime.so
    LoadModule log_config_module modules/mod_log_config.so
    LoadModule env_module modules/mod_env.so
    LoadModule headers_module modules/mod_headers.so
    LoadModule setenvif_module modules/mod_setenvif.so
    LoadModule proxy_module modules/mod_proxy.so
    LoadModule proxy_http_module modules/mod_proxy_http.so
    LoadModule unixd_module modules/mod_unixd.so
    LoadModule alias_module modules/mod_alias.so
    LoadModule dir_module modules/mod_dir.so

    ServerAdmin ops@commerce.local
    ServerName apache-web:8080
    ServerTokens Prod
    ServerSignature Off

    DocumentRoot "/usr/local/apache2/htdocs"
    DirectoryIndex index.html
    <Directory "/usr/local/apache2/htdocs">
        Options None
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ErrorLog /dev/stderr
    LogLevel warn

    LogFormat "{\"timestamp\":\"%{%Y-%m-%dT%H:%M:%S}t.%{msec_frac}tZ\",\"service\":\"apache-web\",\"method\":\"%m\",\"uri\":\"%U\",\"status\":%>s,\"duration_us\":%D,\"traceparent\":\"%{traceparent}i\",\"x_run_id\":\"%{x-run-id}i\",\"x_journey_id\":\"%{x-journey-id}i\",\"x_simulation_scenario\":\"%{x-simulation-scenario}i\"}" json_telemetry
    CustomLog /dev/stdout json_telemetry

    TypesConfig conf/mime.types
    Include conf/conf.d/*.conf
---
apiVersion: v1
kind: Service
metadata:
  name: apache-web
  namespace: commerce-edge
  labels:
    app.kubernetes.io/name: apache-web
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: apache-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-web
  namespace: commerce-edge
  labels:
    app.kubernetes.io/name: apache-web
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apache-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apache-web
        app.kubernetes.io/part-of: commerce-synthetic
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apache-web
          image: commerce/apache-web:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: httpd-conf
              mountPath: /usr/local/apache2/conf/httpd.conf
              subPath: httpd.conf
              readOnly: true
      volumes:
        - name: httpd-conf
          configMap:
            name: apache-httpd-conf
