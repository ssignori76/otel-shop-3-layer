apiVersion: v1
kind: Service
metadata:
  name: journey-generator
  namespace: commerce-edge
  labels:
    app.kubernetes.io/name: journey-generator
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  selector:
    app.kubernetes.io/name: journey-generator
  ports:
    - name: http
      port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: journey-generator
  namespace: commerce-edge
  labels:
    app.kubernetes.io/name: journey-generator
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: journey-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: journey-generator
        app.kubernetes.io/part-of: commerce-synthetic
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: journey-generator
          image: commerce/journey-generator:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: SERVER_PORT
              value: "8085"
            - name: OTEL_SERVICE_NAME
              value: journey-generator
          envFrom:
            - configMapRef:
                name: commerce-edge-config
            - secretRef:
                name: commerce-edge-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            periodSeconds: 10
            timeoutSeconds: 3
