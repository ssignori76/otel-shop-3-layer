apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: commerce-observability
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: commerce-synthetic
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        send_batch_size: 256
        timeout: 500ms

    exporters:
      otlp/jaeger:
        endpoint: jaeger.commerce-observability.svc.cluster.local:4317
        tls:
          insecure: true
      otlphttp/victoriametrics:
        metrics_endpoint: http://victoria-metrics.commerce-observability.svc.cluster.local:8428/opentelemetry/v1/metrics
      otlphttp/victorialogs:
        logs_endpoint: http://victoria-logs.commerce-observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
      prometheus:
        endpoint: 0.0.0.0:8889
        send_timestamps: true
        metric_expiration: 30m
        resource_to_telemetry_conversion:
          enabled: true

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/jaeger]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/victoriametrics, prometheus]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/victorialogs]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: commerce-observability
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: prometheus
      port: 8889
      targetPort: 8889
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: commerce-observability
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: commerce-synthetic
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: commerce/otel-collector:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: prometheus
              containerPort: 8889
            - name: health
              containerPort: 13133
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
