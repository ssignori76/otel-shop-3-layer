# ==============================================================================
# Dynatrace OTLP Credentials Secret (template — override with real values before production deploy)
#
# Supports BOTH Dynatrace authentication schemes:
#   1. Classic API Token: DT_AUTH_SCHEME: "Api-Token"
#      Required scopes: openTelemetryTrace.ingest, metrics.ingest, logs.ingest
#   2. Platform Token:    DT_AUTH_SCHEME: "Bearer"
#      Required scopes: openpipeline:traces:ingest, openpipeline:metrics:ingest, openpipeline:logs:ingest
#
# Recommended production update command (never commit real tokens to Git):
#   kubectl -n commerce-core create secret generic dynatrace-otlp-credentials \
#     --from-literal=DT_OTLP_ENDPOINT="https://<env-id>.live.dynatrace.com/api/v2/otlp" \
#     --from-literal=DT_AUTH_SCHEME="Api-Token" \
#     --from-literal=DT_API_TOKEN="<your-token>" \
#     --dry-run=client -o yaml | kubectl apply -f -
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: dynatrace-otlp-credentials
  namespace: commerce-core
  labels:
    app.kubernetes.io/name: dynatrace-otel-collector
    app.kubernetes.io/part-of: commerce-synthetic
type: Opaque
stringData:
  DT_OTLP_ENDPOINT: "https://<environment-id>.live.dynatrace.com/api/v2/otlp"
  DT_AUTH_SCHEME: "Api-Token"
  DT_API_TOKEN: "REPLACE_WITH_DYNATRACE_TOKEN"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynatrace-otel-collector-config
  namespace: commerce-core
  labels:
    app.kubernetes.io/name: dynatrace-otel-collector
    app.kubernetes.io/part-of: commerce-synthetic
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      # Mandatory for Dynatrace Grail: converts cumulative counters/histograms to delta temporality
      cumulative_to_delta:
        max_staleness: 25h
      batch:
        send_batch_size: 512
        timeout: 2s

    exporters:
      otlp_http/dynatrace:
        endpoint: "${env:DT_OTLP_ENDPOINT}"
        headers:
          # Supports BOTH Classic API Tokens (DT_AUTH_SCHEME=Api-Token)
          # and Platform Tokens (DT_AUTH_SCHEME=Bearer).
          Authorization: "${env:DT_AUTH_SCHEME} ${env:DT_API_TOKEN}"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_http/dynatrace]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, cumulative_to_delta, batch]
          exporters: [otlp_http/dynatrace]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_http/dynatrace]
---
apiVersion: v1
kind: Service
metadata:
  name: dynatrace-otel-collector
  namespace: commerce-core
  labels:
    app.kubernetes.io/name: dynatrace-otel-collector
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  selector:
    app.kubernetes.io/name: dynatrace-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynatrace-otel-collector
  namespace: commerce-core
  labels:
    app.kubernetes.io/name: dynatrace-otel-collector
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dynatrace-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynatrace-otel-collector
        app.kubernetes.io/part-of: commerce-synthetic
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dynatrace-otel-collector
          image: ghcr.io/dynatrace/dynatrace-otel-collector/dynatrace-otel-collector:0.60.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          envFrom:
            - secretRef:
                name: dynatrace-otlp-credentials
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dynatrace-otel-collector-config
