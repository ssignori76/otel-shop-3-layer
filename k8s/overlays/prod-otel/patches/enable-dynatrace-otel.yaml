# Cloud-native ConfigMap patch for Mode 3 (prod-otel):
# Points all 7 Java services to the in-cluster official Dynatrace OTel Collector
# with delta temporality preference for Grail metrics compatibility.
# Structured JSON logs remain unconditionally active on container stdout.
apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-core-config
  namespace: commerce-core
data:
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=commerce-synthetic,deployment.environment.name=production,service.version=2.0.0
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_EXPORTER_OTLP_ENDPOINT: http://dynatrace-otel-collector.commerce-core.svc.cluster.local:4317
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-edge-config
  namespace: commerce-edge
data:
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=commerce-synthetic,deployment.environment.name=production,service.version=2.0.0
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_EXPORTER_OTLP_ENDPOINT: http://dynatrace-otel-collector.commerce-core.svc.cluster.local:4317
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta
