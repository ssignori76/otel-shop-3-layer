apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: commerce-observability
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: commerce-synthetic
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: commerce-fluent-bit-read
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: commerce-synthetic
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: commerce-fluent-bit-read
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: commerce-synthetic
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: commerce-fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: commerce-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: commerce-observability
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: commerce-synthetic
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush           1
        Daemon          Off
        Log_Level       info
        Parsers_File    parsers.conf
        HTTP_Server     On
        HTTP_Listen     0.0.0.0
        HTTP_Port       2020

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*_commerce-edge_*.log,/var/log/containers/*_commerce-core_*.log,/var/log/containers/*_commerce-data_*.log
        Parser            cri
        DB                /tmp/flb_kube.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  5

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       parsed
        Keep_Log            On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

    [OUTPUT]
        Name                http
        Match               kube.*
        Host                victoria-logs.commerce-observability.svc.cluster.local
        Port                9428
        URI                 /insert/jsonline?_stream_fields=kubernetes.namespace_name,kubernetes.pod_name&_msg_field=log&_time_field=date
        Format              json_lines
        Json_date_format    iso8601
        Header              AccountID 0
        Header              ProjectID 0

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: commerce-observability
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
        app.kubernetes.io/part-of: commerce-synthetic
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:3.1.9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2020
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 2020
            periodSeconds: 5
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/parsers.conf
              subPath: parsers.conf
              readOnly: true
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: config
          configMap:
            name: fluent-bit-config
