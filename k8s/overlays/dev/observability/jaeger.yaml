apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: commerce-observability
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: ui-query
      port: 16686
      targetPort: 16686
      nodePort: 30686
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: commerce-observability
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: commerce-synthetic
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          imagePullPolicy: IfNotPresent
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: ui-query
              containerPort: 16686
            - name: admin
              containerPort: 14269
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 14269
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 14269
            periodSeconds: 10
            timeoutSeconds: 3
