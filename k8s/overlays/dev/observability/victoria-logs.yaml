apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: commerce-observability
  labels:
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: victoria-logs
  ports:
    - name: http
      port: 9428
      targetPort: 9428
      nodePort: 30928
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
  namespace: commerce-observability
  labels:
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-logs
        app.kubernetes.io/part-of: commerce-synthetic
    spec:
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.1.0-victorialogs
          imagePullPolicy: IfNotPresent
          args:
            - -storageDataPath=/victoria-logs-data
            - -retentionPeriod=1d
            - -httpListenAddr=:9428
          ports:
            - name: http
              containerPort: 9428
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 9428
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9428
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: vl-data
              mountPath: /victoria-logs-data
      volumes:
        - name: vl-data
          emptyDir: {}
