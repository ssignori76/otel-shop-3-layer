apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: commerce-observability
  labels:
    app.kubernetes.io/name: victoria-metrics
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: victoria-metrics
  ports:
    - name: http
      port: 8428
      targetPort: 8428
      nodePort: 30428
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: commerce-observability
  labels:
    app.kubernetes.io/name: victoria-metrics
    app.kubernetes.io/part-of: commerce-synthetic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-metrics
        app.kubernetes.io/part-of: commerce-synthetic
    spec:
      containers:
        - name: victoria-metrics
          image: victoriametrics/victoria-metrics:v1.106.0
          imagePullPolicy: IfNotPresent
          args:
            - -storageDataPath=/victoria-metrics-data
            - -retentionPeriod=1d
            - -httpListenAddr=:8428
          ports:
            - name: http
              containerPort: 8428
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8428
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8428
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: vm-data
              mountPath: /victoria-metrics-data
      volumes:
        - name: vm-data
          emptyDir: {}
