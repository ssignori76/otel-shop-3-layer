apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-core-config
  namespace: commerce-core
data:
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=commerce-synthetic,deployment.environment.name=test,service.version=2.0.0
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.commerce-observability.svc.cluster.local:4317
  OTEL_METRIC_EXPORT_INTERVAL: "2000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-edge-config
  namespace: commerce-edge
data:
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=commerce-synthetic,deployment.environment.name=test,service.version=2.0.0
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.commerce-observability.svc.cluster.local:4317
  OTEL_METRIC_EXPORT_INTERVAL: "2000"
