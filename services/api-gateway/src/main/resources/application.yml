server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 15s
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 15s
      routes:
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URL:http://auth-service:8086}
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth(?<segment>/?.*), /internal/auth$\{segment}
        - id: products-service-route
          uri: ${CART_SERVICE_URL:http://cart-service:8081}
          predicates:
            - Path=/api/products/**
          filters:
            - RewritePath=/api/products(?<segment>/?.*), /internal/products$\{segment}
        - id: cart-service-route
          uri: ${CART_SERVICE_URL:http://cart-service:8081}
          predicates:
            - Path=/api/carts/**
          filters:
            - RewritePath=/api/carts(?<segment>/?.*), /internal/carts$\{segment}
        - id: checkout-service-route
          uri: ${CHECKOUT_SERVICE_URL:http://checkout-service:8082}
          predicates:
            - Path=/api/checkouts/**
          filters:
            - RewritePath=/api/checkouts(?<segment>/?.*), /internal/checkouts$\{segment}
        - id: orders-service-route
          uri: ${CHECKOUT_SERVICE_URL:http://checkout-service:8082}
          predicates:
            - Path=/api/orders/**
          filters:
            - RewritePath=/api/orders(?<segment>/?.*), /internal/orders$\{segment}
        - id: fulfillment-service-route
          uri: ${FULFILLMENT_SERVICE_URL:http://fulfillment-service:8084}
          predicates:
            - Path=/api/fulfillments/**
          filters:
            - RewritePath=/api/fulfillments(?<segment>/?.*), /internal/fulfillments$\{segment}

commerce:
  auth:
    jwt-secret: ${JWT_SECRET:commerce-local-dev-jwt-secret-key-2026-change-in-prod}
    static-test-token: ${GENERATOR_STATIC_TOKEN:}
  gateway:
    auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:8086}
    cart-service-url: ${CART_SERVICE_URL:http://cart-service:8081}
    checkout-service-url: ${CHECKOUT_SERVICE_URL:http://checkout-service:8082}
    fulfillment-service-url: ${FULFILLMENT_SERVICE_URL:http://fulfillment-service:8084}
    connect-timeout-ms: 3000
    response-timeout-ms: 15000
  scenario:
    name: ${SCENARIO_NAME:NORMAL}
    enabled: ${SCENARIO_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
