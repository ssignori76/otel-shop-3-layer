server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: checkout-service
  lifecycle:
    timeout-per-shutdown-phase: 15s
  datasource:
    url: ${CHECKOUT_DB_URL:jdbc:mysql://mysql:3306/checkout_db?serverTimezone=UTC&characterEncoding=utf8}
    username: ${MYSQL_CHECKOUT_USER:checkout_app}
    password: ${MYSQL_CHECKOUT_PASSWORD:checkout_local_dev_only}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: checkout-hikari-pool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 2000
      connection-test-query: SELECT 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:commerce_app}
    password: ${RABBITMQ_PASSWORD:rabbit_local_dev_only}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

commerce:
  merchant:
    base-url: ${MERCHANT_SERVICE_URL:http://merchant-service:8083}
  scenario:
    name: ${SCENARIO_NAME:NORMAL}
    enabled: ${SCENARIO_ENABLED:false}
    db-slow-duration-ms: ${DB_SLOW_DURATION_MS:1500}
    db-operation-timeout-ms: ${DB_OPERATION_TIMEOUT_MS:1000}
    merchant-timeout-ms: ${MERCHANT_TIMEOUT_MS:1500}
    broker-publish-timeout-ms: ${BROKER_PUBLISH_TIMEOUT_MS:1500}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true
    rabbit:
      enabled: true
