server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

spring:
  application:
    name: auth-service
  lifecycle:
    timeout-per-shutdown-phase: 15s
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://mysql:3306/auth_db?serverTimezone=UTC&characterEncoding=utf8}
    username: ${MYSQL_AUTH_USER:auth_app}
    password: ${MYSQL_AUTH_PASSWORD:auth_local_dev_only}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: auth-hikari-pool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 2000
      connection-test-query: SELECT 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

commerce:
  auth:
    jwt-secret: ${JWT_SECRET:commerce-local-dev-jwt-secret-key-2026-change-in-prod}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
    demo-user:
      enabled: ${DEMO_USER_ENABLED:true}
      email: ${DEMO_USER_EMAIL:demo@otelshop.local}
      full-name: ${DEMO_USER_FULL_NAME:Demo Shopper}
      password: ${DEMO_USER_PASSWORD:DemoPass123!}
  scenario:
    name: ${SCENARIO_NAME:NORMAL}
    enabled: ${SCENARIO_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true
