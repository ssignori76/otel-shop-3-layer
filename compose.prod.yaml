# ==============================================================================
# Mode 2: Production (prod) — Dynatrace OneAgent + RUM Integration
# Usage: docker compose -f compose.yaml -f compose.prod.yaml up -d
#        (or: make up-prod)
#
# - Disables bundled OpenTelemetry Java Agent (JAVA_TOOL_OPTIONS="") and sets
#   all OTel exporters to "none" to avoid dual-agent conflicts with OneAgent.
# - Deploys ZERO local observability containers.
# - Structured JSON logs continue to be written unconditionally to container stdout.
# ==============================================================================
services:
  auth-service:
    environment:
      JAVA_TOOL_OPTIONS: ""
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none

  cart-service:
    environment:
      JAVA_TOOL_OPTIONS: ""
      OTEL_TRACES_EXPORTER: none
